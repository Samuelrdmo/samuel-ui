name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The library is built before the docs so a broken public entrypoint
      # fails on its own step instead of somewhere inside the site bundle.
      - name: Build library
        run: pnpm build:ui

      - name: Build docs
        run: pnpm build:docs

      - name: Build Storybook
        run: pnpm build:storybook
